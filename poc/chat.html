<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그룹 AI 준법감시 에이전트 · POC</title>
<style>
  :root {
    --bg: #f4f5f8;
    --surface: #ffffff;
    --ink: #1b2030;
    --ink-muted: #5c6478;
    --line: #dde1ea;
    --navy: #1c2b4a;
    --navy-2: #33456c;
    --accent: #a9762f;
    --user-bubble: #1c2b4a;
    --user-text: #ffffff;
    --assistant-bubble: #eef0f5;
    --warn-bg: #f7e9d9;
    --warn-ink: #8a5a1e;
    --danger: #b23b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e121b;
      --surface: #161c29;
      --ink: #e8eaf1;
      --ink-muted: #99a1b8;
      --line: #2a3145;
      --navy: #7f93c2;
      --navy-2: #9fadcb;
      --accent: #d9a75a;
      --user-bubble: #2b3a5c;
      --user-text: #f2f4fa;
      --assistant-bubble: #1e2536;
      --warn-bg: #2e2415;
      --warn-ink: #e0ac63;
      --danger: #e17a7a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    flex: none;
    padding: 16px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 700;
  }
  header .badges {
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 11.5px;
  }
  .badge {
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--ink-muted);
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    white-space: nowrap;
  }
  .badge.dept { color: var(--accent); border-color: var(--accent); }
  .badge.warn { color: var(--warn-ink); border-color: var(--warn-ink); background: var(--warn-bg); }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--ink-muted);
    font-size: 13.5px;
    max-width: 42ch;
    line-height: 1.7;
  }
  .empty-state b { color: var(--ink); }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }

  .bubble {
    max-width: 72%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row.user .bubble {
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }
  .row.assistant .bubble {
    background: var(--assistant-bubble);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }
  .row.system .bubble {
    background: transparent;
    border: 1px dashed var(--line);
    color: var(--ink-muted);
    font-size: 13px;
    max-width: 100%;
  }

  .citations {
    max-width: 72%;
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .cite-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .cite-chip {
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink-muted);
  }
  .cite-warn {
    font-size: 12px;
    color: var(--warn-ink);
    background: var(--warn-bg);
    border-radius: 6px;
    padding: 5px 9px;
  }

  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink-muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  footer {
    flex: none;
    border-top: 1px solid var(--line);
    background: var(--surface);
    padding: 14px 24px 20px;
  }
  .composer {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 14.5px;
    font-family: inherit;
    background: var(--bg);
    color: var(--ink);
    max-height: 160px;
    line-height: 1.5;
  }
  textarea:focus { outline: 2px solid var(--navy-2); outline-offset: 1px; }
  button#send {
    flex: none;
    border: none;
    border-radius: 12px;
    padding: 0 20px;
    height: 44px;
    background: var(--navy);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button#send:disabled { opacity: 0.5; cursor: default; }
  button#send:not(:disabled):hover { background: var(--navy-2); }
  .hint {
    max-width: 820px;
    margin: 8px auto 0;
    font-size: 11.5px;
    color: var(--ink-muted);
  }
</style>
</head>
<body>

  <header>
    <h1>그룹 AI 준법감시 에이전트</h1>
    <div class="badges">
      <span class="badge warn">POC — 로컬 전용, 인증 없음</span>
      <span class="badge dept" id="dept-badge">부서 확인 중…</span>
    </div>
  </header>

  <main id="log">
    <div class="empty-state" id="empty-state">
      법령·사규·유권해석·제재사례 등에 대해 질문해 보세요.<br>
      예: <b>"자금세탁방지 보고책임자의 직급 요건이 뭐야?"</b>
    </div>
  </main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="질문을 입력하세요 (Shift+Enter로 줄바꿈)"></textarea>
      <button id="send">전송</button>
    </div>
    <div class="hint">이 페이지는 <code>POC_UI_ENABLED=true</code>일 때만 동작합니다 — 절대 공유/운영 서버에 켜두지 마세요.</div>
  </footer>

<script>
(function () {
  "use strict";

  const log = document.getElementById("log");
  const emptyState = document.getElementById("empty-state");
  const deptBadge = document.getElementById("dept-badge");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  let token = null;
  let sending = false;

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }
  input.addEventListener("input", autoGrow);

  function scrollToBottom() {
    log.scrollTop = log.scrollHeight;
  }

  function addRow(role, text) {
    if (emptyState) emptyState.remove();
    const row = document.createElement("div");
    row.className = "row " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    log.appendChild(row);
    scrollToBottom();
    return row;
  }

  function addTyping() {
    const row = addRow("assistant", "");
    row.querySelector(".bubble").innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    return row;
  }

  function addCitations(afterRow, verified, rejected) {
    if ((!verified || verified.length === 0) && (!rejected || rejected.length === 0)) return;
    const wrap = document.createElement("div");
    wrap.className = "citations";
    if (verified && verified.length > 0) {
      const chips = document.createElement("div");
      chips.className = "cite-chips";
      verified.forEach(function (id) {
        const chip = document.createElement("span");
        chip.className = "cite-chip";
        chip.textContent = id;
        chips.appendChild(chip);
      });
      wrap.appendChild(chips);
    }
    if (rejected && rejected.length > 0) {
      const warn = document.createElement("div");
      warn.className = "cite-warn";
      warn.textContent = "출처 미확인으로 제외된 인용 " + rejected.length + "건";
      wrap.appendChild(warn);
    }
    afterRow.insertAdjacentElement("afterend", wrap);
    scrollToBottom();
  }

  async function fetchToken() {
    const res = await fetch("/poc/token");
    if (!res.ok) {
      const detail = await res.text();
      throw new Error("토큰 발급 실패 (" + res.status + "): " + detail);
    }
    const data = await res.json();
    token = data.token;
    deptBadge.textContent = "부서: " + data.dept;
  }

  async function send() {
    const message = input.value.trim();
    if (!message || sending) return;

    sending = true;
    sendBtn.disabled = true;
    input.value = "";
    autoGrow();

    addRow("user", message);
    const typingRow = addTyping();

    try {
      if (!token) await fetchToken();

      const res = await fetch("/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token,
        },
        body: JSON.stringify({ message: message }),
      });

      if (!res.ok) {
        let detail = res.statusText;
        try { detail = (await res.json()).detail || detail; } catch (e) {}
        typingRow.querySelector(".bubble").textContent =
          "오류 (" + res.status + "): " + detail;
        return;
      }

      const data = await res.json();
      typingRow.querySelector(".bubble").textContent = data.answer;
      addCitations(typingRow, data.verified_citations, data.rejected_citations);
    } catch (err) {
      typingRow.className = "row system";
      typingRow.querySelector(".bubble").textContent =
        "서버에 연결할 수 없습니다. uvicorn이 실행 중인지, POC_UI_ENABLED=true인지 확인하세요.\n(" + err.message + ")";
    } finally {
      sending = false;
      sendBtn.disabled = false;
      scrollToBottom();
    }
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  fetchToken().catch(function (err) {
    deptBadge.textContent = "토큰 발급 실패";
    addRow("system", err.message);
  });

  input.focus();
})();
</script>

</body>
</html>
